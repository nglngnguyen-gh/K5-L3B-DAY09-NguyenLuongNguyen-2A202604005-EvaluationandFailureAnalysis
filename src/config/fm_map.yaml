# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket text (injected delay, authority claim) overrides the DB row
stale_policy: FM-06            # clause cited by the customer is superseded / not yet effective
clause_sum: FM-04              # agent sums clause parts instead of taking the official quote
double_deduct: FM-05           # agent subtracts prior refunds the host already deducts
sibling_refund: FM-07          # "gom đơn": money written under sibling claims of the same order
denied_ignored: FM-02          # host denies (expired approval / already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # approval caps below quote; reply must state the ledger amount
cross_principal: FM-09         # claimant reads/acts on another principal's order
